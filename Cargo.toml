[package]
name = "nexus"
version = "0.3.0"
edition = "2021"
authors = ["Nexus Contributors"]
description = "Nexus - a privacy-first, universal search engine: crawler, PageRank, dedup, and BM25-based ranking"
license = "MIT"

[[bin]]
name = "nexus"
path = "src/main.rs"

[lib]
name = "nexus"
path = "src/lib.rs"
crate-type = ["rlib"]
# WASM builds additionally require cdylib (add via --cfg when targeting wasm32)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
clap_derive = "=4.4.7"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
walkdir = "2.4"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
unicode-normalization = "0.1"
unicode-segmentation = "=1.10.1"
thiserror = "1.0"
toml = "=0.8.12"
dirs = "5.0"
notify = "=6.1.1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.3"
regex = "1.10"
indexmap = "=2.2.6"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "socks", "json"] }
url = { version = "=2.4.1", features = ["serde"] }
scraper = "0.18"
quick-xml = "0.31"
serde_json = "1"
tiny_http = "0.12"
pulldown-cmark = "0.9"
urlencoding = "2"
pdf-extract = "0.7"

# Local extractors (this pass)
zip = { version = "0.6", default-features = false, features = ["deflate"] } # docx/xlsx/pptx (OOXML) and generic archive listing
roxmltree = "0.19"          # OOXML part parsing (docx/xlsx/pptx are zipped XML)
rusqlite = { version = "0.31", features = ["bundled"] } # SQLite note stores + browser-history reading
mail-parser = "0.9"         # .eml / MIME email parsing
kamadak-exif = "0.5"        # EXIF metadata from images (paired with optional external `tesseract` OCR)
encoding_rs = "0.8"         # legacy mbox/eml charset handling
headless_chrome = { version = "1.0", optional = true } # feature-gated JS rendering (src/web/render.rs)

# WebSocket
tungstenite = "0.21"

# Cryptography
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = "1"

# WASM
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "WebSocket", "MessageEvent", "Worker", "DedicatedWorkerGlobalScope", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "Storage", "Blob", "BlobPropertyBag", "Url"] }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"] }

# Browser / IndexedDB
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "console_error_panic_hook", "serde-wasm-bindgen"]
headless_render = ["headless_chrome"]
