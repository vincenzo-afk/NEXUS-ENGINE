[package]
name = "nexus"
version = "0.2.0"
edition = "2021"
authors = ["Nexus Contributors"]
description = "Nexus - a local + web search engine: crawler, PageRank, dedup, and BM25-based ranking"
license = "MIT"

[[bin]]
name = "nexus"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
clap_derive = "=4.4.7"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
walkdir = "2.4"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
unicode-normalization = "0.1"
unicode-segmentation = "=1.10.1"
thiserror = "1.0"
toml = "=0.8.12"
dirs = "5.0"
notify = "=6.1.1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.3"
regex = "1.10"
indexmap = "=2.2.6"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
url = { version = "=2.4.1", features = ["serde"] }
scraper = "0.18"
quick-xml = "0.31"
serde_json = "1"
tiny_http = "0.12"
pulldown-cmark = "0.9"
urlencoding = "2"
pdf-extract = "0.7"
